name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Repository validation
        run: ./scripts/validate-repo.sh

      - name: Shell scripts (shellcheck)
        run: shellcheck install.sh scripts/*.sh controller-hidraw-gate
