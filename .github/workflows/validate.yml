name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install the daemon's runtime deps as SYSTEM packages so the system
      # python3 that validate-repo.sh invokes can import them. Without this the
      # unit tests hit ModuleNotFoundError and self-skip (exit 0) - CI went
      # green because the tests never ran, not because they passed. Using apt
      # (not actions/setup-python + pip) avoids compiling evdev/dbus/PyGObject
      # C extensions, which is slow and flaky.
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-evdev python3-dbus python3-gi

      - name: Repository validation
        run: ./scripts/validate-repo.sh

      - name: Shell scripts (shellcheck)
        run: shellcheck install.sh scripts/*.sh controller-hidraw-gate controller-led
